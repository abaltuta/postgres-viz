<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/media/style.css" />
    <title>Postgres Viz UI Harness</title>
    <script>
      const targets = Array.from({ length: 60 }, (_, index) => ({
        data: {
          id: `target${String(index).padStart(2, "0")}`,
          label: `Target ${index}`,
          type: "table",
          schema: "public",
          oid: index + 2,
        },
      }));
      const graph = {
        nodes: [
          { data: { id: "hub", label: "Hub", type: "function", schema: "public", oid: 1 } },
          ...targets,
          {
            data: {
              id: "c2_1",
              label: "customer_id",
              type: "column",
              parent: "target00",
              schema: "public",
              oid: 2,
              ord: 1,
            },
          },
        ],
        edges: [
          ...targets.map((target, index) => ({
            data: {
              id: `edge${index}`,
              source: "hub",
              target: target.data.id,
              kind: "calls",
              agg: true,
              count: 1,
              kinds: { calls: 1 },
            },
          })),
          {
            data: { id: "detail-read", source: "hub", target: "c2_1", kind: "reads", detail: true },
          },
          ...targets.slice(1, 31).map((target, index) => ({
            data: {
              id: `detail-usage-${index}`,
              source: target.data.id,
              target: "c2_1",
              kind: ["reads", "updates", "fk"][index % 3],
              detail: true,
            },
          })),
        ],
        stats: { function: 1, table: 60, edges: 60, cardEdges: 60 },
      };
      const prefs = {
        layout: "grid",
        edgeMode: "cards",
        schemaGroup: false,
        route: false,
        hideIsolated: false,
        engine: "v1",
        filterSchemas: [],
        filterNodeTypes: [],
        filterEdgeKinds: [],
      };
      const usageKinds = ["reads", "updates", "fk"];
      const columnUsageGroups = [
        {
          id: "c2_1|hub|reads",
          kind: "reads",
          section: "sql",
          owner: {
            id: "hub",
            type: "function",
            oid: 1,
            schema: "public",
            name: "hub",
            label: "Hub",
          },
          count: 4,
          occurrences: [{ id: "hub:0", snippet: "SELECT customer_id", exact: true }],
        },
        ...targets.slice(1, 31).map((target, index) => {
          const kind = usageKinds[index % usageKinds.length];
          return {
            id: `c2_1|${target.data.id}|${kind}`,
            kind,
            section: kind === "fk" ? "structural" : "sql",
            owner: {
              id: target.data.id,
              type: "table",
              oid: target.data.oid,
              schema: "public",
              name: target.data.label,
              label: target.data.label,
            },
            count: 31 - index,
            occurrences:
              kind === "fk"
                ? []
                : [
                    {
                      id: `${target.data.id}:0`,
                      snippet: `${kind === "reads" ? "SELECT" : "UPDATE"} customer_id`,
                      exact: true,
                    },
                  ],
          };
        }),
      ];
      globalThis.__hostMessages = [];
      globalThis.acquireVsCodeApi = () => ({
        postMessage(message) {
          globalThis.__hostMessages.push(message);
          if (message.type === "ready") {
            setTimeout(() => {
              window.dispatchEvent(
                new MessageEvent("message", {
                  data: { type: "graph", graph, database: "ui-test", revision: 1 },
                }),
              );
              window.dispatchEvent(new MessageEvent("message", { data: { type: "prefs", prefs } }));
              setTimeout(
                () =>
                  window.dispatchEvent(
                    new MessageEvent("message", { data: { type: "searchSelect", id: "hub" } }),
                  ),
                100,
              );
            }, 0);
          } else if (message.type === "requestColumnUsages") {
            setTimeout(
              () =>
                window.dispatchEvent(
                  new MessageEvent("message", {
                    data: {
                      type: "columnUsages",
                      revision: 1,
                      requestId: message.requestId,
                      result: {
                        columnId: "c2_1",
                        groups: columnUsageGroups,
                      },
                    },
                  }),
                ),
              0,
            );
          } else if (message.type === "requestUsageOccurrences") {
            const group = columnUsageGroups.find((candidate) => candidate.id === message.groupId);
            setTimeout(
              () =>
                window.dispatchEvent(
                  new MessageEvent("message", {
                    data: {
                      type: "usageOccurrences",
                      revision: 1,
                      requestId: message.requestId,
                      page: {
                        groupId: message.groupId,
                        offset: message.offset,
                        total: group?.occurrences.length ?? 0,
                        occurrences: group?.occurrences ?? [],
                      },
                    },
                  }),
                ),
              0,
            );
          }
        },
      });
    </script>
  </head>
  <body class="vscode-dark">
    <div id="content">
      <div id="canvas">
        <div
          id="cy"
          role="region"
          aria-label="Database graph. Use arrow keys to navigate objects and Enter to open details."
          tabindex="0"
        ></div>
        <section id="usage-matrix" class="hidden" aria-label="Column usage matrix">
          <div class="matrix-toolbar">
            <input
              id="matrix-search"
              type="search"
              aria-label="Filter usage owners"
              placeholder="Filter definitions"
            />
            <div
              id="matrix-categories"
              class="matrix-categories"
              role="group"
              aria-label="Relationship category"
            ></div>
          </div>
          <div id="matrix-scroll" class="matrix-scroll"></div>
        </section>
        <div id="crumb" class="hidden"></div>
        <button id="reset-filters" class="hidden">Clear filters</button>
        <div id="empty" role="status">Loading</div>
        <footer id="canvas-footer">
          <div id="legend"></div>
          <div id="stats"></div>
        </footer>
      </div>
      <aside id="panel" class="hidden" aria-label="Object details">
        <div
          id="panel-resize"
          role="separator"
          aria-label="Resize details panel"
          aria-orientation="vertical"
          aria-valuemin="220"
          aria-valuemax="680"
          aria-valuenow="300"
          tabindex="0"
        ></div>
        <div id="panel-body"></div>
      </aside>
    </div>
    <script src="/media/webview.js"></script>
    <script>
      setTimeout(async () => {
        const errors = [];
        const canvas = document.querySelector("#canvas");
        const graphSurface = document.querySelector("#cy");
        const panel = document.querySelector("#panel");
        const renderedCanvas = graphSurface.querySelector("canvas");
        const connectionButtons = panel.querySelectorAll(".edge-link");
        if (panel.classList.contains("hidden")) errors.push("details panel did not open");
        if (!renderedCanvas || renderedCanvas.width === 0 || renderedCanvas.height === 0) {
          errors.push("cytoscape canvas is blank");
        }
        const surfaces = [...graphSurface.querySelectorAll("canvas")];
        const graphPainted = surfaces.some((surface) => {
          const pixels = surface
            .getContext("2d")
            ?.getImageData(0, 0, surface.width, surface.height).data;
          if (!pixels) return false;
          for (let offset = 3; offset < pixels.length; offset += 4) {
            if (pixels[offset] !== 0) return true;
          }
          return false;
        });
        if (!graphPainted) {
          const instance = graphSurface._cyreg?.cy;
          const diagnostics = {
            canvases: surfaces.map((surface) => `${surface.width}x${surface.height}`),
            edges: instance?.edges().length,
            firstNode: instance
              ? {
                  box: instance.nodes().first().renderedBoundingBox(),
                  display: instance.nodes().first().style("display"),
                  opacity: instance.nodes().first().style("opacity"),
                  position: instance.nodes().first().renderedPosition(),
                }
              : undefined,
            nodes: instance?.nodes().length,
            pan: instance?.pan(),
            zoom: instance?.zoom(),
          };
          errors.push(`cytoscape canvas has no painted pixels ${JSON.stringify(diagnostics)}`);
        }
        if (connectionButtons.length !== 40)
          errors.push(`initial connection page=${connectionButtons.length}`);
        const showMore = panel.querySelector(".show-more");
        if (!showMore) errors.push("show-more control missing");
        const selectedBefore = globalThis.__hostMessages.filter(
          (message) => message.type === "nodeSelected",
        ).length;
        showMore?.click();
        const expandedButtons = panel.querySelectorAll(".edge-link").length;
        const selectedAfter = globalThis.__hostMessages.filter(
          (message) => message.type === "nodeSelected",
        ).length;
        if (expandedButtons !== 60) errors.push(`expanded connection page=${expandedButtons}`);
        if (selectedAfter !== selectedBefore) errors.push("paging repeated node selection");
        graphSurface.focus();
        graphSurface.dispatchEvent(
          new KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true }),
        );
        graphSurface.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
        if (!/Press Enter to open details/.test(graphSurface.getAttribute("aria-label") ?? "")) {
          errors.push("keyboard focus label did not update");
        }
        const canvasRect = canvas.getBoundingClientRect();
        const panelRect = panel.getBoundingClientRect();
        if (innerWidth > 620 && canvasRect.right > panelRect.left + 1)
          errors.push("wide panel overlaps canvas");
        if (innerWidth <= 620 && canvasRect.bottom > panelRect.top + 1)
          errors.push("narrow panel overlaps canvas");
        if (panelRect.height < 100 || panelRect.bottom > innerHeight + 1) {
          errors.push(
            `details panel outside viewport ${JSON.stringify({ bottom: panelRect.bottom, height: panelRect.height, viewport: innerHeight })}`,
          );
        }
        if (document.documentElement.scrollWidth > innerWidth + 1)
          errors.push("horizontal overflow");
        window.dispatchEvent(
          new MessageEvent("message", { data: { type: "searchSelect", id: "c2_1" } }),
        );
        await new Promise((resolve) => setTimeout(resolve, 250));
        const usage = panel.querySelector("#column-usages");
        const occurrence = usage?.querySelector("button[data-occurrence-id]");
        if (!usage || !/Used in definitions/.test(usage.textContent ?? "")) {
          errors.push("column usage section did not render");
        }
        occurrence?.click();
        if (!globalThis.__hostMessages.some((message) => message.type === "openUsage")) {
          errors.push("column occurrence did not request source navigation");
        }
        const instance = graphSurface._cyreg?.cy;
        window.dispatchEvent(
          new MessageEvent("message", {
            data: { type: "prefs", prefs: { ...prefs, emphasizeConnections: true } },
          }),
        );
        await new Promise((resolve) => setTimeout(resolve, 25));
        if (!instance?.getElementById("hub").hasClass("connection-high")) {
          errors.push("connection emphasis did not identify the rendered hub");
        }
        window.dispatchEvent(
          new MessageEvent("message", {
            data: {
              type: "prefs",
              prefs: { ...prefs, emphasizeConnections: true, filterEdgeKinds: ["reads"] },
            },
          }),
        );
        await new Promise((resolve) => setTimeout(resolve, 25));
        if (!instance?.nodes(".connection-high, .connection-medium").empty()) {
          errors.push("connection emphasis did not recompute after edge filtering");
        }
        window.dispatchEvent(
          new MessageEvent("message", {
            data: { type: "prefs", prefs: { ...prefs, emphasizeConnections: true } },
          }),
        );
        await new Promise((resolve) => setTimeout(resolve, 150));
        if (!instance?.getElementById("hub").hasClass("connection-high")) {
          errors.push("connection emphasis did not recover after clearing edge filters");
        }
        if ((instance?.zoom() ?? 0) < 0.94)
          errors.push(
            `column smart zoom=${instance?.zoom()} selected=${instance
              ?.nodes(":selected")
              .map((node) => `${node.id()}:${node.data("type")}`)
              .join(",")} panel=${panel.querySelector("h2")?.textContent}`,
          );
        const baseViewport = { zoom: instance?.zoom(), pan: { ...instance?.pan() } };
        const neighborhoodButton = panel.querySelector("#neighborhood-btn");
        const matrixButton = panel.querySelector("#matrix-btn");
        if (!neighborhoodButton || neighborhoodButton.disabled) {
          errors.push(
            `neighborhood action unavailable (${panel.querySelector("h2")?.textContent ?? "no heading"})`,
          );
        }
        if (!matrixButton || matrixButton.disabled) {
          errors.push(
            `matrix action unavailable (${panel.querySelector("h2")?.textContent ?? "no heading"})`,
          );
        }
        neighborhoodButton?.click();
        await new Promise((resolve) => setTimeout(resolve, 350));
        if (!document.querySelector("#content")?.classList.contains("view-radial")) {
          errors.push("radial neighborhood did not open");
        }
        const summaries = instance?.nodes(".radial-summary") ?? [];
        if (summaries.length === 0) errors.push("busy radial view has no grouped summary nodes");
        const clippedSummaries = summaries.flatMap((summary) => {
          const box = summary.renderedBoundingBox({ includeLabels: true });
          return box.x1 < 0 ||
            box.y1 < 0 ||
            box.x2 > graphSurface.clientWidth ||
            box.y2 > graphSurface.clientHeight
            ? [{ id: summary.id(), box }]
            : [];
        });
        if (clippedSummaries.length > 0) {
          errors.push(
            `radial fit clipped grouped summary nodes: ${JSON.stringify(clippedSummaries)}`,
          );
        }
        const radialPainted = [...graphSurface.querySelectorAll("canvas")].some((surface) => {
          const pixels = surface
            .getContext("2d")
            ?.getImageData(0, 0, surface.width, surface.height).data;
          return pixels && pixels.some((value, index) => index % 4 === 3 && value !== 0);
        });
        if (!radialPainted) errors.push("radial neighborhood canvas is blank");
        if (
          summaries.some(
            (summary) =>
              !Number.isFinite(summary.position("x")) || !Number.isFinite(summary.position("y")),
          )
        ) {
          errors.push("radial summary position is invalid");
        }
        globalThis.__radialReady = true;
        await new Promise((resolve) => setTimeout(resolve, 200));
        summaries[0]?.emit("tap");
        await new Promise((resolve) => setTimeout(resolve, 50));
        const matrix = document.querySelector("#usage-matrix");
        if (!matrix || matrix.classList.contains("hidden")) {
          errors.push("radial summary did not open the matrix");
        }
        if (!document.querySelector(".matrix-categories button.active")) {
          errors.push("matrix category filter was not initialized");
        }
        document.querySelector("#crumb-back")?.click();
        if (
          document.querySelector("#neighborhood-btn")?.classList.contains("active-neighborhood")
        ) {
          errors.push("radial→matrix→base left the neighborhood action active");
        }
        if (!instance?.getElementById("hub").hasClass("connection-high")) {
          errors.push("connection emphasis was lost across radial→matrix→base");
        }
        if (
          Math.abs((instance?.zoom() ?? 0) - baseViewport.zoom) > 0.001 ||
          Math.abs((instance?.pan("x") ?? 0) - baseViewport.pan.x) > 0.5 ||
          Math.abs((instance?.pan("y") ?? 0) - baseViewport.pan.y) > 0.5
        ) {
          errors.push("radial view did not restore the base viewport");
        }
        matrixButton?.click();
        await new Promise((resolve) => setTimeout(resolve, 20));
        const search = document.querySelector("#matrix-search");
        search.value = "Target 29";
        search.dispatchEvent(new Event("input", { bubbles: true }));
        const matrixRows = document.querySelectorAll("#matrix-scroll tbody tr:not(.matrix-detail)");
        if (matrixRows.length !== 1) errors.push(`matrix search rows=${matrixRows.length}`);
        const writeCell = document.querySelector(
          '#matrix-scroll button[data-matrix-cell="writes"]:not(:disabled)',
        );
        writeCell?.click();
        if (!document.querySelector("#matrix-scroll .matrix-detail")) {
          errors.push("matrix operation cell did not expand");
        }
        const matrixOccurrence = document.querySelector(
          "#matrix-scroll button[data-occurrence-id]",
        );
        matrixOccurrence?.click();
        if (
          globalThis.__hostMessages.filter((message) => message.type === "openUsage").length < 2
        ) {
          errors.push("matrix occurrence did not request source navigation");
        }
        if (document.documentElement.scrollWidth > innerWidth + 1) {
          errors.push("matrix caused horizontal page overflow");
        }

        window.dispatchEvent(
          new MessageEvent("message", { data: { type: "searchSelect", id: "c2_1" } }),
        );
        await new Promise((resolve) => setTimeout(resolve, 75));
        document.querySelector("#neighborhood-btn")?.click();
        window.dispatchEvent(
          new MessageEvent("message", {
            data: { type: "graph", graph, database: "ui-test", revision: 2 },
          }),
        );
        const replacement = graphSurface._cyreg?.cy;
        const replacementViewport = {
          zoom: replacement?.zoom(),
          pan: { ...replacement?.pan() },
        };
        await new Promise((resolve) => setTimeout(resolve, 75));
        if (
          Math.abs((replacement?.zoom() ?? 0) - replacementViewport.zoom) > 0.001 ||
          Math.abs((replacement?.pan("x") ?? 0) - replacementViewport.pan.x) > 0.5 ||
          Math.abs((replacement?.pan("y") ?? 0) - replacementViewport.pan.y) > 0.5
        ) {
          errors.push("stale radial panel callback changed the replacement graph viewport");
        }
        const result = document.createElement("div");
        result.id = "ui-test-result";
        result.dataset.result = errors.length === 0 ? "pass" : "fail";
        result.dataset.details = encodeURIComponent(JSON.stringify(errors));
        document.body.append(result);
      }, 900);
    </script>
  </body>
</html>
