name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  database:
    name: PostgreSQL ${{ matrix.postgres }}
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17, 18, 19]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db
        env:
          PGVIZ_POSTGRES_MAJOR: ${{ matrix.postgres }}
  verify:
    needs: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm smoke
      - run: pnpm build
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - run: pnpm test:ui
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
      - run: go vet ./...
      - run: pnpm release
      - run: sha256sum --check SHA256SUMS
        working-directory: release/assets
      - uses: actions/upload-artifact@v4
        with:
          name: postgres-viz-release
          path: release/assets/
          if-no-files-found: error

  draft-release:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: postgres-viz-release
          path: assets
      - run: sha256sum --check SHA256SUMS
        working-directory: assets
      - name: Create a draft with the tested downloads
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes
