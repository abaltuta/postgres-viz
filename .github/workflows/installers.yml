name: Update release installers

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: update-release-installers

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/sync-installers.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit updated installers
        run: |
          git add Formula/postgres-viz.rb bucket/postgres-viz.json README.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update installers to the latest published release'
          git push origin HEAD:main
